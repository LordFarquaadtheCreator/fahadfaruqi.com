name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Origin every asset is served from; the wasm bakes it in at build time and the
  # site's default (src/lib/assets.js) is the same value.
  ASSETS_BASE: https://assets.fahadfaruqi.com/www

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          # Must match interpreter/go.mod: wasm_exec.js is published from this toolchain.
          go-version-file: interpreter/go.mod
      - run: npm ci
      - run: npm run build
      - name: Publish the interpreter to the CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 -m venv /tmp/r2
          /tmp/r2/bin/pip install --quiet boto3
          /tmp/r2/bin/python scripts/publish-wasm.py
      - uses: actions/configure-pages@v6
      - name: Delete stale github-pages artifacts
        run: |
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[] | select(.name=="github-pages") | .url' 2>/dev/null || true)
          for url in $artifacts; do
            gh api -X DELETE "$url" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./build
      - id: deployment
        uses: actions/deploy-pages@v5